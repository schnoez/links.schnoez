    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #050505;
            color: #f5f5f5;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px max(48px, calc(32px + env(safe-area-inset-bottom)));
            background: #050505;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 10px 24px rgba(0,0,0,0.3);
        }
        .name {
            font-size: clamp(30px, 7vw, 54px);
            font-weight: 400;
            letter-spacing: 0.24em;
            margin-bottom: 10px;
            text-transform: uppercase;
            line-height: 1;
        }
        .username {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.72);
            margin-bottom: 34px;
            text-transform: lowercase;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 17px 20px;
            background: rgba(12, 12, 14, 0.34);
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.26em;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.5);
            text-transform: uppercase;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            user-select: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 12px 24px rgba(0,0,0,0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn:hover,
        .btn:focus-visible {
            transform: translateY(-1px);
            background: rgba(18, 18, 20, 0.38);
            border-color: rgba(255,255,255,0.82);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 14px 28px rgba(0,0,0,0.14);
        }
        .btn.vip {
            animation: edge 3.6s ease-in-out 1.2s infinite;
        }
        @keyframes edge {
            0%, 100% { border-color: rgba(255, 255, 255, 0.4); }
            50% { border-color: rgba(255, 255, 255, 1); }
        }
        @media (max-width: 420px) {
            .username {
                letter-spacing: 0.08em;
            }
            .btn {
                letter-spacing: 0.18em;
                padding: 15px 16px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .btn.vip { animation: none; }
            .btn { transition: none; }

</head>
<body>
    <div class="container">

</html>
