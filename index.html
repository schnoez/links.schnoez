<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>schnoez</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta name="referrer" content="no-referrer">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #050505;
            color: #f5f5f5;
            font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px max(48px, calc(32px + env(safe-area-inset-bottom)));
            background: #050505;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 10px 24px rgba(0,0,0,0.3);
        }
        .name {
            font-size: clamp(30px, 7vw, 54px);
            font-weight: 400;
            letter-spacing: 0.24em;
            margin-bottom: 10px;
            text-transform: uppercase;
            line-height: 1;
            font-family: "Helvetica Neue", Inter, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .username {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.72);
            margin-bottom: 34px;
            text-transform: lowercase;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            position: relative;
            isolation: isolate;
            display: flex;
            width: 100%;
            min-height: 56px;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            overflow: hidden;
            background: transparent;
            color: #f4f0e8;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.32em;
            border-radius: 999px;
            border: 1px solid rgba(244,240,232,0.72);
            text-transform: uppercase;
            transition: transform 0.35s cubic-bezier(.2,.75,.25,1), border-color 0.35s ease, color 0.35s ease;
            cursor: pointer;
            user-select: none;
        }
        .btn::before {
            position: absolute;
            z-index: -1;
            inset: 0;
            border-radius: inherit;
            background: rgba(22,21,19,.2);
            content: "";
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.35s ease;
        }
        .btn:focus-visible {
            transform: translateY(-2px);
            border-color: #d6c8b7;
            color: #282522;
            outline: none;
        }
        .btn:focus-visible::before { background: #d6c8b7; }
        @media (hover: hover) and (pointer: fine) {
            .btn:hover {
                transform: translateY(-2px);
                border-color: #d6c8b7;
                color: #282522;
            }
            .btn:hover::before { background: #d6c8b7; }
        }
        .btn.vip {
            animation: edge 3.6s ease-in-out 1.2s infinite;
        }
        @keyframes edge {
            0%, 100% { border-color: rgba(244, 240, 232, 0.42); }
            50% { border-color: rgba(244, 240, 232, 0.9); }
        }
        @media (max-width: 420px) {
            .username {
                letter-spacing: 0.1em;
            }
            .btn {
                letter-spacing: 0.25em;
                padding: 15px 16px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .btn.vip { animation: none; }
            .btn, .btn::before { transition: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="hintergrund_schnoez_1_small.jpg" alt="schnoez">
        <div class="name">schnoez</div>
        <div class="username">@schnoez</div>
        <div class="links">
            <a class="btn vip" href="https://onlyfans.com/schnoez" id="vip-btn" rel="noreferrer">Exclusive</a>
            <a class="btn" href="https://www.instagram.com/schnoez" rel="noreferrer">Instagram</a>
            <a class="btn" href="https://x.com/schnoezX" rel="noreferrer">X / Twitter</a>
            <a class="btn" href="https://www.tiktok.com/@schnoezz" rel="noreferrer">TikTok</a>
            <a class="btn" href="https://bsky.app/profile/schnoez.bsky.social" rel="noreferrer">Bluesky</a>
        </div>
    </div>
    <script>
        window.addEventListener("pageshow", function (event) {
            if (event.persisted) location.reload();
        });
        document.getElementById("vip-btn").addEventListener("click", function () {
            this.textContent = "Loading...";
        });
    </script>
</body>
</html>
